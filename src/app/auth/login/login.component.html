<div class="max-w-xs w-96">
  <form (ngSubmit)="submit()" class="bg-white shadow-md px-7 pt-5 pb-8 mb-6 rounded-lg border " #myForm="ngForm" >
    <h1 class="text-center text-xl">Zaloguj</h1>
    <div class="mb-4">
      <div class="relative z-0 mb-6 w-full group">
        <input type="email" name="email" class="block py-2 px-0 w-full text-sm bg-transparent border-0 border-b border-gray-300 appearance-none dark:text-main-500 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" "  id="email"
        type="email" name="email" [(ngModel)] = "form.email" #email="ngModel" required/>
        <label for="email" class="font-thin absolute text-sm text-main-500 dark:text-main-500 duration-300 transform -translate-y-6 scale-75 top-2 -z-10 origin-[0] peer-focus:left-0 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Email</label>
      </div>
    </div>
    <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-xs mb-4 p-4 bg-red-400 text-white rounded">
      Email musi być prawidłowy.
    </div>

    <div class="mb-6">
      <div class="relative z-0 mb-6 w-full group">
        <input class="block py-2 px-0 w-full text-sm bg-transparent border-0 border-b border-gray-300 appearance-none dark:text-main-500 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        id="password" type="password" placeholder=" " name="password"  [(ngModel)] = "form.password" #password="ngModel" required/>
        <label for="password" class="font-thin absolute text-sm text-main-500 dark:text-main-500 duration-300 transform -translate-y-6 scale-75 top-2 -z-10 origin-[0] peer-focus:left-0 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Hasło</label>
      </div>
    </div>
    <div *ngIf="password.invalid && (password.dirty ||  password.touched)" class="text-xs mb-4 p-4 bg-red-400 text-white rounded">
      Wprowadź hasło
    </div>
    <div class="flex items-center justify-between">
      <button class="p-2 w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 cursor-pointer rounded focus:outline-none focus:shadow-outline"
      type="submit"  [disabled]="myForm.form.invalid">
      <ng-container *ngIf="isLoading()">
        Logowanie...
      </ng-container>
      <ng-container *ngIf="!isLoading()">
        Zaloguj
      </ng-container>
    </button>

<!--      <a class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800" href="#">
        Forgot Password?
      </a>-->
    </div>
  </form>
  <p class="text-center text-xs">
    &copy;2023 Slaws. Wszelkie prawa zastrzeżone.
  </p>
</div>
